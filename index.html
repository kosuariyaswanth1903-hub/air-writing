<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gesture Drawing Final</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
body { margin:0; overflow:hidden; background:black; }

video {
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  transform: scaleX(-1);
}

canvas {
  position:absolute;
  top:0; left:0;
}

#mode {
  position:absolute;
  top:20px; left:20px;
  color:cyan;
  font-size:20px;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<div id="mode">MODE: NONE</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

/* Drawing */
let strokes = [];
let currentStroke = null;

/* Move offset */
let offsetX = 0;
let offsetY = 0;

let prevPinchX = null;
let prevPinchY = null;

let prevX = null;
let prevY = null;

/* MediaPipe */
const hands = new Hands({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.7
});

/* Finger detection */
function isFingerUp(tip, pip) {
  return tip.y < pip.y;
}

hands.onResults(results => {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  /* Draw all strokes */
  ctx.strokeStyle = "cyan";
  ctx.lineWidth = 3;

  strokes.forEach(stroke => {
    if (stroke.length < 2) return;

    ctx.beginPath();
    ctx.moveTo(stroke[0].x + offsetX, stroke[0].y + offsetY);

    for (let i = 1; i < stroke.length; i++) {
      ctx.lineTo(stroke[i].x + offsetX, stroke[i].y + offsetY);
    }

    ctx.stroke();
  });

  if (!results.multiHandLandmarks) return;

  const hand = results.multiHandLandmarks[0];

  /* ✅ MIRROR FIX */
  let x = (1 - hand[8].x) * canvas.width;
  let y = hand[8].y * canvas.height;

  /* Fingers */
  const indexUp = isFingerUp(hand[8], hand[6]);
  const middleUp = isFingerUp(hand[12], hand[10]);
  const ringUp = isFingerUp(hand[16], hand[14]);
  const pinkyUp = isFingerUp(hand[20], hand[18]);

  /* Pinch */
  const dx = hand[4].x - hand[8].x;
  const dy = hand[4].y - hand[8].y;
  const pinchDist = Math.sqrt(dx*dx + dy*dy);
  const isPinch = pinchDist < 0.05;

  const isFist = !indexUp && !middleUp && !ringUp && !pinkyUp;
  const isWriting = indexUp && !middleUp && !ringUp && !pinkyUp;

  let mode = "NONE";

  /* 🤏 MOVE CANVAS */
  if (isPinch) {
    mode = "MOVE";

    if (prevPinchX !== null) {
      offsetX += (x - prevPinchX);
      offsetY += (y - prevPinchY);
    }

    prevPinchX = x;
    prevPinchY = y;

    currentStroke = null;
    prevX = null;

  }
  /* ✊ PAUSE */
  else if (isFist) {
    mode = "PAUSE";

    currentStroke = null;
    prevX = null;

    prevPinchX = null;
    prevPinchY = null;

  }
  /* ☝️ DRAW */
  else if (isWriting) {
    mode = "DRAW";

    prevPinchX = null;
    prevPinchY = null;

    if (!currentStroke) {
      currentStroke = [];
      strokes.push(currentStroke);
    }

    /* Smooth */
    if (prevX !== null) {
      x = prevX * 0.7 + x * 0.3;
      y = prevY * 0.7 + y * 0.3;
    }

    currentStroke.push({x, y});

    prevX = x;
    prevY = y;
  }
  else {
    mode = "NONE";

    currentStroke = null;
    prevX = null;

    prevPinchX = null;
  }

  document.getElementById("mode").innerText = "MODE: " + mode;
});

/* Camera */
const camera = new Camera(video, {
  onFrame: async () => {
    await hands.send({image: video});
  },
  width: 640,
  height: 480
});

camera.start();
</script>

</body>
</html>
