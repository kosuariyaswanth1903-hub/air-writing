<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air Draw - Fixed Stable</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
body { margin:0; overflow:hidden; background:black; }

video {
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  transform: scaleX(-1);
}

canvas {
  position:absolute;
  top:0;
  left:0;
}

#mode {
  position:absolute;
  top:20px;
  left:20px;
  color:white;
  font-size:20px;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<div id="mode">MODE: IDLE</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const modeText = document.getElementById("mode");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

/* ===== STATE ===== */
let strokes = [];
let currentStroke = null;
let mode = "IDLE";

let offset = {x:0, y:0};
let pinchStart = null;
let offsetStart = null;

/* ===== HELPERS ===== */
function mirrorX(x) {
  return (1 - x) * canvas.width;
}

function getPos(p) {
  return {
    x: mirrorX(p.x),
    y: p.y * canvas.height
  };
}

/* ===== GESTURE ===== */
function detect(hand) {
  const up = (tip, pip) => hand[tip].y < hand[pip].y;

  const index = up(8,6);
  const middle = up(12,10);
  const ring = up(16,14);
  const pinky = up(20,18);

  const dx = hand[4].x - hand[8].x;
  const dy = hand[4].y - hand[8].y;
  const pinch = Math.hypot(dx,dy) < 0.05;

  if (pinch) return "MOVE";
  if (!index && !middle && !ring && !pinky) return "PAUSE";
  if (index && !middle && !ring && !pinky) return "DRAW";

  return "IDLE";
}

/* ===== DRAW ===== */
function drawAll() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  strokes.forEach(s => {
    if (s.points.length < 2) return;

    ctx.beginPath();
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 4;
    ctx.lineCap = "round";

    ctx.moveTo(s.points[0].x + offset.x, s.points[0].y + offset.y);

    for (let i=1;i<s.points.length;i++) {
      ctx.lineTo(
        s.points[i].x + offset.x,
        s.points[i].y + offset.y
      );
    }
    ctx.stroke();
  });
}

/* ===== MEDIAPIPE ===== */
const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});

hands.setOptions({
  maxNumHands:1,
  minDetectionConfidence:0.7,
  minTrackingConfidence:0.7
});

hands.onResults(res => {
  drawAll();

  if (!res.multiHandLandmarks) {
    mode = "IDLE";
    currentStroke = null;
    pinchStart = null;
    return;
  }

  const hand = res.multiHandLandmarks[0];
  const newMode = detect(hand);
  const finger = getPos(hand[8]);

  /* ===== MODE SWITCH FIX ===== */
  if (mode !== newMode) {
    if (newMode !== "DRAW") currentStroke = null;
    if (newMode !== "MOVE") pinchStart = null;
    mode = newMode;
  }

  modeText.innerText = "MODE: " + mode;

  /* ===== DRAW ===== */
  if (mode === "DRAW") {
    if (!currentStroke) {
      currentStroke = {points:[], color:"#00ffff"};
      strokes.push(currentStroke);
    }

    currentStroke.points.push({
      x: finger.x - offset.x,
      y: finger.y - offset.y
    });
  }

  /* ===== MOVE (FIXED) ===== */
  if (mode === "MOVE") {
    if (!pinchStart) {
      pinchStart = {x: finger.x, y: finger.y};
      offsetStart = {...offset};
    }

    offset.x = offsetStart.x + (finger.x - pinchStart.x);
    offset.y = offsetStart.y + (finger.y - pinchStart.y);
  }
});

/* ===== CAMERA ===== */
const camera = new Camera(video, {
  onFrame: async () => {
    await hands.send({image: video});
  },
  width:640,
  height:480
});

camera.start();
</script>

</body>
</html>
